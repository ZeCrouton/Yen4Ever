<style>
/* Disposition : adversaire en haut, météo au centre, joueur en bas, main sous le plateau */
:root{
  --ink:#15110e; --panel:#1f1914; --panel2:#2a2119; --line:#4a3b2c;

.card.hero{border-top-color:var(--gold);background:#2f2415}

.hand{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);z-index:5;display:flex;flex-direction:column;background:var(--ink);border-top:1px solid var(--line);box-shadow:0 -8px 16px rgba(0,0,0,.35)}
.handrow{display:flex;gap:6px;overflow-x:auto;padding:64px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.cardinfo{min-height:44px;padding:4px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));font-size:14px;line-height:1.35;color:var(--bone);border-top:1px solid var(--line)}
.cardinfo b{font:700 14px var(--f-display);color:var(--gold);letter-spacing:.03em}
.hand .card{cursor:pointer}
.hand .card.sel{transform:scale(1.87);transform-origin:50% 100%;z-index:2;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 6px 14px rgba(0,0,0,.6)}
.hsc{position:absolute;top:0;left:0;right:0;z-index:0;text-align:center;font:700 12px var(--f-display);letter-spacing:.06em;line-height:18px;pointer-events:none;font-variant-numeric:tabular-nums}
.hsc .la{display:block;font:400 11px var(--f-body,inherit);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:16px;padding:0 16px}
.hsc .e{color:#e0604a}
.hsc .p{color:#5fb85f}
.handrow.zoom{padding-top:130px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}
.hand.off .card{opacity:.55;cursor:not-allowed}
.grp{border-top:1px solid var(--line);padding:6px 0}
.grp summary{cursor:pointer;font:700 14px var(--f-display);letter-spacing:.04em;color:var(--gold);padding:6px 2px;list-style:none}
.grp summary::-webkit-details-marker{display:none}
.grp summary::before{content:'▸ ';display:inline-block;transition:transform .15s}
.grp[open] summary::before{content:'▾ '}
.grpbody{padding:4px 2px 8px}
.grpbody p{margin:0 0 6px}
.c-close{--c:#e0604a}
.c-ranged{--c:#4f8fe0}
.c-siege{--c:#a77de0}
.c-ab{--c:#2fbfa6}
.c-hero{--c:#f2c94c}
.c-spec{--c:#e0559c}
.c-wx{--c:#8fe3f5}
.inspect{position:fixed;inset:0;z-index:20;background:rgba(10,8,6,.74);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.inspect[hidden]{display:none}
.insp-card .big{width:150px;height:214px;cursor:pointer}
.insp-card .big .n{font-size:14px;padding:18px 4px 30px;max-height:70px}
.insp-card .big .s{min-width:36px;height:36px;border-radius:18px;font-size:22px}
.insp-txt{max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:15px;line-height:1.4;color:var(--bone)}
.insp-txt b{font:700 16px var(--f-display);color:var(--gold)}
.insp-hint{font-size:12px;color:var(--mute)}
.sigtab{width:100%;border-collapse:collapse;font-size:14px}
.sigtab td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.sigtab td:first-child{width:44px;white-space:nowrap}
.sigtab .ico{width:18px;height:18px;color:var(--c,var(--gold));margin-right:2px}
.fac{display:flex;flex-direction:column;gap:8px}
.fac .btn{text-align:left;padding:10px 14px}
.fac small{font-weight:400;color:var(--mute)}
.mull{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mull .card.sel{border-color:var(--gold);transform:translateY(-6px);box-shadow:0 0 0 2px var(--gold)}
.wxbar{text-align:center;font:600 12px var(--f-display);letter-spacing:.08em;color:var(--mute);padding:2px 0}
.wxbar b{color:var(--frost)}
.log{min-height:60px;background:var(--panel);border-left:3px solid var(--gold);padding:8px 10px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.log span:not(:last-child){color:var(--mute)}
.ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--gold);min-width:0}
.modal{position:fixed;inset:0;background:rgba(10,8,6,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.box{background:var(--panel);border:1px solid var(--gold);max-width:440px;width:100%;padding:20px;border-radius:6px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.box p,.box ul{margin:0}
.box ul{padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.opt{display:flex;align-items:center;gap:10px;font-size:16px}
.opt input{width:20px;height:20px}
.score{font:700 34px var(--f-display);text-align:center;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .12s}}
</style>
<div id="app">
  <div class="top"><div class="topin"><h1>Yen4Ever</h1><span class="tools"><button class="btn" id="b-rules">Règles</button><button class="btn" id="b-mute" aria-pressed="false">Son : on</button></span></div></div>

<script>
/* ===== Logique du jeu ===== */
const ROWS = ['close', 'ranged', 'siege'];
const ROW_FR = { close: 'Mêlée', ranged: 'Distance', siege: 'Siège' };
let UID = 1;

const FAC = { nord: 'Royaumes du Nord', nilfgaard: 'Nilfgaard', skellige: 'Skellige' };
/* Noms d'adversaires, selon sa faction (style univers The Witcher) */
const NAMES = {
  nord: ['Anselm Vanhoek', 'Gerhard Stoltz', 'Morvan Hengst', 'Tancred Lüdeke', 'Osric Brenne', 'Radovan Kessel', 'Dietrich Halvard'],
  nilfgaard: ['Aurelio Scaravelli', 'Cassio Morrano', 'Tullio Benedetto', 'Orso Valcarra', 'Ettore Caravello'],
  skellige: ['Eskil Ragnvald', 'Torvald Hakonsen', 'Sigurd Kjellar', 'Gunnar Ulfsson', 'Ottar Haldersen', 'Brand Ottesen', 'Halvar Rune']
};
let namesOn = true;
try { namesOn = localStorage.getItem('gwent-names') !== '0'; } catch (e) {}
const oppOn = () => (namesOn && G && G.oppName) || null;
const OPP_NAME = () => oppOn() || 'Adversaire';
const OPP_SUJ = () => oppOn() || 'L’adversaire';
const OPP_DE = () => oppOn() || 'l’adversaire';
const FAC_TXT = { nord: 'Pioche une carte à chaque manche gagnée.', nilfgaard: 'Remporte la manche en cas d’égalité.', skellige: 'Berserkers et Mardroeme ; 2 unités reviennent au début de la manche 3.' };
const randFac = () => Object.keys(FAC)[Math.floor(Math.random() * 3)];

function makePool(faction) {
  const L = [];
  const add = (n, c) => { for (let i = 0; i < n; i++) L.push({ kind: 'unit', hero: false, ab: null, ...c, id: UID++ }); };
  add(1, { name: 'Capitaine Aldric', str: 10, row: 'close', hero: true });
  add(1, { name: 'Mage Vessa', str: 10, row: 'ranged', hero: true });
  add(1, { name: 'Maître Ormund', str: 10, row: 'siege', hero: true });
  add(3, { name: 'Hallebardier', str: 4, row: 'close', ab: 'bond' });
  add(2, { name: 'Arbalétrier', str: 4, row: 'ranged', ab: 'bond' });
  add(1, { name: 'Éclaireur', str: 1, row: 'close', ab: 'spy' });
  add(1, { name: 'Infiltré', str: 2, row: 'ranged', ab: 'spy' });
  add(1, { name: 'Guérisseuse', str: 2, row: 'close', ab: 'medic' });
  add(1, { name: 'Apothicaire', str: 3, row: 'ranged', ab: 'medic' });
  add(1, { name: 'Porte-étendard', str: 2, row: 'close', ab: 'morale' });
  add(1, { name: 'Barde', str: 1, row: 'ranged', ab: 'morale' });
  add(1, { name: 'Fantassin', str: 5, row: 'close' });
  add(1, { name: 'Piquier', str: 6, row: 'close' });
  add(1, { name: 'Cavalier', str: 7, row: 'close' });
  add(1, { name: 'Archer', str: 5, row: 'ranged' });
  add(1, { name: 'Catapulte', str: 8, row: 'siege' });
  add(1, { name: 'Baliste', str: 6, row: 'siege' });
  add(1, { name: 'Bélier', str: 5, row: 'siege' });
  add(3, { name: 'Milicien', str: 3, row: 'close', ab: 'muster' });
  add(2, { name: 'Voltigeur', str: 4, row: 'close', agile: true });
  add(2, { name: 'Chasseur', str: 3, row: 'close', agile: true, ab: 'bond' });
  add(1, { name: 'Émissaire', str: 7, row: 'ranged', hero: true, ab: 'spy' });
  if (faction === 'skellige') {
    add(2, { name: 'Berserker', str: 4, row: 'close', ab: 'berserk' });
    add(1, { kind: 'mardroeme', name: 'Mardroeme' });
  }
  add(2, { kind: 'horn', name: 'Cor de guerre' });
  add(1, { kind: 'scorch', name: 'Brasier' });
  add(1, { kind: 'decoy', name: 'Leurre', str: 0 });
  add(1, { kind: 'weather', name: 'Gel mordant', w: 'close' });
  add(1, { kind: 'weather', name: 'Brouillard épais', w: 'ranged' });
  add(1, { kind: 'weather', name: 'Pluie torrentielle', w: 'siege' });
  add(1, { kind: 'weather', name: 'Ciel dégagé', w: 'clear' });
  return L;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const emptyRows = () => ({ close: [], ranged: [], siege: [] });
const emptyHorn = () => ({ close: null, ranged: null, siege: null });

function newGame(fp, fe) {
  const st = {
    round: 1, lives: { p: 2, e: 2 },
    oppName: NAMES[fe][Math.floor(Math.random() * NAMES[fe].length)],
    hands: { p: [], e: [] },
    faction: { p: fp, e: fe },
    deck: { p: shuffle(makePool(fp)), e: shuffle(makePool(fe)) },
    board: { p: emptyRows(), e: emptyRows() },
    horn: { p: emptyHorn(), e: emptyHorn() },
    grave: { p: [], e: [] },
    weather: { close: false, ranged: false, siege: false },
    passed: { p: false, e: false },
    starter: Math.random() < 0.5 ? 'p' : 'e',
    history: [], over: false, winner: null, logs: []
  };
  st.turn = st.starter;
  drawCards(st, 'p', 10);
  drawCards(st, 'e', 10);
  return st;
}

function drawCards(st, side, n) {
  for (let i = 0; i < n && st.deck[side].length; i++) st.hands[side].push(st.deck[side].pop());
}

/* Force d'une carte posée : météo, lien étroit, moral, puis cor. Les héros sont immunisés. */
function cardStr(st, side, row, c) {
  if (c.kind !== 'unit') return 0;
  if (c.hero) return c.str;
  const R = st.board[side][row];
  let v = st.weather[row] ? 1 : c.str;
  if (c.ab === 'bond') {
    const i = R.indexOf(c);
    let run = 1;
    for (let j = i - 1; j >= 0 && R[j].ab === 'bond' && R[j].name === c.name; j--) run++;
    for (let j = i + 1; j < R.length && R[j].ab === 'bond' && R[j].name === c.name; j++) run++;
    if (run >= 2) v *= run;
  }
  v += R.filter(x => x.ab === 'morale' && x !== c).length;
  if (st.horn[side][row]) v *= 2;
  return v;
}
const rowScore = (st, side, row) => st.board[side][row].reduce((s, c) => s + cardStr(st, side, row, c), 0);
const total = (st, side) => ROWS.reduce((s, r) => s + rowScore(st, side, r), 0);

function bestGrave(st, side) {
  const t = st.grave[side].filter(g => g.kind === 'unit' && !g.hero);
  return t.length ? t.reduce((a, b) => (b.str > a.str ? b : a)) : null;
}

/* Joue une carte de la main. arg : rangée (cor), id de cible (leurre). Retourne un message. */
function play(st, side, id, arg) {
  const hand = st.hands[side];
  const card = hand.splice(hand.findIndex(x => x.id === id), 1)[0];
  const opp = side === 'p' ? 'e' : 'p';
  const who = side === 'p' ? 'Vous jouez' : OPP_SUJ() + ' joue';
  let msg = `${who} ${card.name}.`;
  if (card.kind === 'unit') {
    if (card.agile && arg) card.row = arg;
    if (card.ab === 'spy') {
      st.board[opp][card.row].push(card);
      drawCards(st, side, 2);
      msg += ' Espion : 2 cartes piochées.';
    } else {
      st.board[side][card.row].push(card);
      if (card.ab === 'muster') {
        const pull = [...st.hands[side], ...st.deck[side]].filter(x => x.name === card.name);
        for (const x of pull) {
          for (const src of [st.hands[side], st.deck[side]]) { const i = src.indexOf(x); if (i >= 0) src.splice(i, 1); }
          st.board[side][x.row].push(x);
        }
        if (pull.length) msg += ` Sursaut : ${pull.length} carte(s) rejoignent le plateau.`;
      }
      if (card.ab === 'medic' && side === 'e') {
        const t = bestGrave(st, side);
        if (t) {
          st.grave[side].splice(st.grave[side].indexOf(t), 1);
          st.board[side][t.row].push(t);
          msg += ` ${t.name} revient au combat.`;
        }
      }
    }
  } else if (card.kind === 'mardroeme') {
    for (const r of ROWS) if (st.board[side][r].some(x => x.id === arg)) {
      let n = 0;
      st.board[side][r] = st.board[side][r].map(x => x.ab === 'berserk' ? (n++, { kind: 'unit', hero: false, ab: null, name: 'Ours de combat', str: 8, row: r, id: x.id }) : x);
      msg += ` ${n} Berserker(s) se transforment en ours de combat.`;
    }
    st.grave[side].push(card);
  } else if (card.kind === 'horn') {
    st.horn[side][arg] = card;
    msg += ` Rangée ${ROW_FR[arg]} doublée.`;
  } else if (card.kind === 'scorch') {
    const all = [];
    for (const sd of ['p', 'e']) for (const r of ROWS) for (const c of st.board[sd][r])
      if (c.kind === 'unit' && !c.hero) all.push({ sd, r, c, v: cardStr(st, sd, r, c) });
    const mx = Math.max(0, ...all.map(x => x.v));
    if (mx > 0) {
      const dead = all.filter(x => x.v === mx);
      for (const d of dead) {
        st.board[d.sd][d.r].splice(st.board[d.sd][d.r].indexOf(d.c), 1);
        st.grave[d.sd].push(d.c);
      }
      msg += ` ${dead.length} unité(s) de force ${mx} détruite(s).`;
    }
    st.grave[side].push(card);
  } else if (card.kind === 'weather') {
    if (card.w === 'clear') { for (const r of ROWS) st.weather[r] = false; }
    else st.weather[card.w] = true;
    st.grave[side].push(card);
  } else if (card.kind === 'decoy') {
    for (const r of ROWS) {
      const i = st.board[side][r].findIndex(x => x.id === arg);
      if (i >= 0) {
        const t = st.board[side][r][i];
        st.board[side][r][i] = card;
        card.row = r;
        hand.push(t);
        msg += ` ${t.name} retourne en main.`;
        break;
      }
    }
  }
  return msg;
}

function actions(st, side) {
  const out = [];
  for (const c of st.hands[side]) {
    if (c.kind === 'horn') { for (const r of ROWS) if (!st.horn[side][r]) out.push({ id: c.id, card: c, arg: r }); }
    else if (c.kind === 'mardroeme') {
      for (const r of ROWS) for (const t of st.board[side][r]) if (t.ab === 'berserk') out.push({ id: c.id, card: c, arg: t.id });
    } else if (c.agile) { for (const r of ['close', 'ranged']) out.push({ id: c.id, card: c, arg: r }); }
    else if (c.kind === 'decoy') {
      for (const r of ROWS) for (const t of st.board[side][r])
        if (t.kind === 'unit' && !t.hero) out.push({ id: c.id, card: c, arg: t.id });
    } else out.push({ id: c.id, card: c });
  }
  return out;
}

/* Fin de manche : points, vies. Le plateau reste visible jusqu'à clearRound. */
function scoreRound(st) {
  const tp = total(st, 'p'), te = total(st, 'e');
  let w = tp > te ? 'p' : te > tp ? 'e' : null;
  if (!w) {
    const np = st.faction.p === 'nilfgaard', ne = st.faction.e === 'nilfgaard';
    if (np && !ne) w = 'p'; else if (ne && !np) w = 'e';
  }
  if (w === 'p') st.lives.e--; else if (w === 'e') st.lives.p--; else { st.lives.p--; st.lives.e--; }
  const rec = { n: st.round, tp, te, w };
  st.history.push(rec);
  return rec;
}

function clearRound(st, w) {
  for (const sd of ['p', 'e']) {
    for (const r of ROWS) {
      st.grave[sd].push(...st.board[sd][r]);
      st.board[sd][r] = [];
      if (st.horn[sd][r]) { st.grave[sd].push(st.horn[sd][r]); st.horn[sd][r] = null; }
    }
  }
  for (const r of ROWS) st.weather[r] = false;
  if (w && st.faction[w] === 'nord') drawCards(st, w, 1); /* bonus Royaumes du Nord : une carte à chaque manche gagnée */
  st.passed = { p: false, e: false };
  st.round++;
  if (st.round === 3) for (const sd of ['p', 'e']) if (st.faction[sd] === 'skellige') {
    const pool = shuffle(st.grave[sd].filter(g => g.kind === 'unit' && !g.hero)).slice(0, 2);
    for (const u of pool) { st.grave[sd].splice(st.grave[sd].indexOf(u), 1); st.board[sd][u.row].push(u); }
    if (pool.length) st.logs.push(`${sd === 'p' ? 'Vos' : 'Ses'} unités de Skellige reviennent : ${pool.map(u => u.name).join(', ')}.`);
  }
  if (st.lives.p <= 0 || st.lives.e <= 0) {
    st.over = true;
    st.winner = st.lives.p > 0 ? 'p' : st.lives.e > 0 ? 'e' : 'draw';
  } else {
    st.starter = w || (st.starter === 'p' ? 'e' : 'p');
    st.turn = st.starter;
  }
}

/* ===== Adversaire ===== */
function aiChoose(st) {
  const A = actions(st, 'e');
  if (!A.length) return null;
  const d0 = total(st, 'e') - total(st, 'p');
  const pPassed = st.passed.p;
  if (pPassed && d0 > 0) return null;
  const early = st.lives.e === 2 && st.lives.p === 2 && st.hands.e.length >= 6;
  if (!pPassed && d0 >= (early ? 12 : 20)) return null;
  let best = null, bs = -1e9;
  for (const a of A) {
    const t = JSON.parse(JSON.stringify(st));
    play(t, 'e', a.id, a.arg);
    const d = total(t, 'e') - total(t, 'p');
    const gain = d - d0;
    const cost = (a.card.kind === 'unit' ? a.card.str : 4) * (a.card.hero ? 1.2 : 0.5);
    let sc;
    if (pPassed) sc = d > 0 ? 100 - cost : gain - 50;
    else sc = gain - cost * 0.6 + (a.card.ab === 'spy' ? 4 : 0);
    if (sc > bs) { bs = sc; best = a; }
  }
  if (pPassed && bs < 0 && st.lives.e > 1) return null;
  if (!pPassed && bs < -3 && d0 > 0) return null;
  return best;
}

/* Bruitage léger d'une carte posée (synthèse WebAudio, sans fichier). Coupé avec le bouton Son. */
let actx = null;
function sfxCard() {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    const out = actx.createGain();
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(0.13, t + 0.008);
    out.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    out.connect(actx.destination);
    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(85, t + 0.12);
    o.connect(out);
    o.start(t); o.stop(t + 0.2);
    const len = Math.floor(actx.sampleRate * 0.07);
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = actx.createBufferSource();
    src.buffer = buf;
    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 0.9;
    const ng = actx.createGain();
    ng.gain.value = 0.3;
    src.connect(bp); bp.connect(ng); ng.connect(out);
    src.start(t);
  } catch (e) {}
}

function rowHtml(side, row) {

    const tgt = side === 'p' && sc && ((sc.kind === 'decoy' && c.kind === 'unit' && !c.hero) || (sc.kind === 'mardroeme' && c.ab === 'berserk'));
    const attrs = side === 'p' && tgt ? `data-act="${sc.kind === 'mardroeme' ? 'mard' : 'decoy'}" data-id="${c.id}"` : `data-insp="${c.id}"`;

    `<div class="cards">${cards}</div></div>`;
}

/* Sauvegarde locale : la partie survit à une actualisation ou à une sortie par erreur */
const SAVE_KEY = 'yen4ever-save';
function persist() {
  try {
    if (inGame && !G.over) localStorage.setItem(SAVE_KEY, JSON.stringify({ G, UID, inGame, viewTurn }));
    else localStorage.removeItem(SAVE_KEY);
  } catch (e) {}
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || !d.G || d.G.over || !d.inGame) return false;
    G = d.G; UID = d.UID; inGame = true; viewTurn = d.viewTurn; sel = null; modalOpen = false;
    hideModal();
    render();
    if (G.passed.p && G.passed.e) finishRound();
    else if (G.pendingAfter) afterAction();
    else if (G.turn === 'e') setTimeout(aiMove, 700);
    return true;
  } catch (e) { return false; }
}

function pushLog(m) { G.logs.push(m); if (G.logs.length > 3) G.logs.shift(); }

function showModal(html) {
  modalOpen = true;
  $('modal').innerHTML = `<div class="box">${html}</div>`;
  $('modal').hidden = false;
}
function hideModal() { modalOpen = false; $('modal').hidden = true; }

/* Une rangée est-elle une cible valide pour la carte sélectionnée ? */
function rowOK(sc, pr) {
  return !!sc && sc.agile && pr !== 'siege';
}
/* Cartes qui attendent une cible sur le plateau (rangée, cor, leurre, mardroeme) */
const needsTarget = c => c.agile || c.kind === 'horn' || c.kind === 'decoy' || c.kind === 'mardroeme';

function humanPlay(id, arg) {
  const card = G.hands.p.find(x => x.id === id);
  pushLog(play(G, 'p', id, arg));
  sfxCard();
  if (card && card.ab === 'medic' && medicTargets().length) return pickMedic();
  afterAction();
}

/* Médic joueur : le joueur choisit l'unité relevée (hors Héros et spéciales) */
const medicTargets = () => G.grave.p.filter(g => g.kind === 'unit' && !g.hero);
function pickMedic() {
  showModal(`<h2>Médic</h2><p>Choisissez une unité de votre défausse à relever sur le plateau.</p>` +
    `<div class="mull">${medicTargets().map(c => cardHtml(c, c.str, '', `data-revive="${c.id}"`)).join('')}</div>`);
  render();
}

function afterAction() {
  const s = G;
  s.pendingAfter = false;
  for (const sd of ['p', 'e']) if (!s.passed[sd] && !s.hands[sd].length) {
    s.passed[sd] = true;
    pushLog(sd === 'p' ? 'Vous n’avez plus de cartes : vous passez.' : OPP_SUJ() + ' n’a plus de cartes et passe.');
  }
  if (s.passed.p && s.passed.e) { render(); return finishRound(); }
  const other = s.turn === 'p' ? 'e' : 'p';
  if (!s.passed[other]) s.turn = other;
  render();
  if (s.turn === 'e') setTimeout(aiMove, 900);
}

function aiMove() {
  if (G.over || G.turn !== 'e' || modalOpen) return;
  const a = aiChoose(G);
  if (a) {
    pushLog(play(G, 'e', a.id, a.arg));
    sfxCard();
    G.pendingAfter = true;
    render();
    /* Pause : le joueur voit le plateau de l'adversaire et la carte posée avant de reprendre la main (2,2 s) */
    const g0 = G;
    setTimeout(() => { if (G === g0) afterAction(); }, 2200);
  } else {
    G.passed.e = true; pushLog(OPP_SUJ() + ' passe.');
    afterAction();
  }
}

function finishRound() {
  let rec;
  if (G.roundPending) rec = G.history[G.history.length - 1];
  else { rec = scoreRound(G); G.roundPending = true; }
  const res = rec.tp === rec.te && rec.w ? 'Égalité : Nilfgaard remporte la manche.' : rec.w === 'p' ? 'Vous remportez la manche.' : rec.w === 'e' ? OPP_SUJ() + ' remporte la manche.' : 'Égalité : chacun perd une vie.';
  render();
  showModal(`<h2>Manche ${rec.n}</h2><p class="score">${rec.te} — ${rec.tp}</p><p>${res}${rec.w && G.faction[rec.w] === 'nord' ? ' Royaumes du Nord : une carte est piochée.' : ''}</p><button class="btn primary" id="m-ok">Continuer</button>`);
  $('m-ok').onclick = () => {
    clearRound(G, rec.w);
    G.roundPending = false;
    sel = null;
    if (G.over) {
      const t = G.winner === 'p' ? 'Victoire !' : G.winner === 'e' ? 'Défaite' : 'Égalité';
      const d = G.history.map(h => `Manche ${h.n} : ${h.te} — ${h.tp}`).join('<br>');
      showModal(`<h2>${t}</h2><p>${d}</p><button class="btn primary" id="m-new">Rejouer</button>`);
      $('m-new').onclick = restart;
      render();
    } else {
      hideModal(); render();
      if (G.turn === 'e') setTimeout(aiMove, 700);
    }
  };
}

<li><b>Distance</b> (bordure bleue) : tireurs, comme l’Archer ou l’Arbalétrier. Touchée par le Brouillard épais.</li>
<li><b>Siège</b> (bordure violette) : engins, comme la Catapulte, la Baliste ou le Bélier. Jamais Agile. Touchée par la Pluie torrentielle.</li></ul>
<p><b>Chaque camp a ses 3 rangées</b> : Mêlée, Distance, Siège. L’adversaire est en haut, vous êtes en bas. Chaque rangée a son propre total, affiché à gauche.</p>
<p><b>Les cartes ne se battent pas entre elles.</b> Vos unités ne détruisent jamais celles de l’adversaire en les touchant. Chaque camp additionne seulement ses propres rangées, et on compare les deux scores à la fin.</p>
<p><b>Où se pose une carte ?</b> Une unité va dans sa rangée, indiquée par son sigle et la couleur de sa bordure (rouge = Mêlée, bleu = Distance, violet = Siège). Les cartes Agiles choisissent Mêlée ou Distance.</p>
<p><b>Ce qui reste dans votre camp</b> (une rangée à la fois) :</p>
<ul>
<li><b>Lien</b> et <b>Moral</b> : ne comptent qu’avec les cartes de votre même rangée.</li>
<li><b>Cor de guerre</b> : double toute la rangée que vous choisissez, de votre côté seulement. Un cor par rangée.</li></ul>
<p><b>Comment agir sur l’adversaire</b> (seulement 3 moyens) :</p>
<ul>
<li><b>Météo</b> : touche la même rangée des deux camps. Le Gel mordant ramène à 1 la force de toutes les cartes de Mêlée, les vôtres comme les siennes. Utile quand l’adversaire a beaucoup de points dans cette rangée et vous peu.</li>
<li><b>Brasier</b> : regarde les deux plateaux et détruit l’unité la plus forte (ou toutes celles à égalité), chez lui comme chez vous. Les Héros sont épargnés.</li>
<li><b>Espion</b> : se pose dans la rangée de même nom chez l’adversaire. Sa force augmente son score, pas le vôtre. En échange, vous piochez 2 cartes.</li></ul>
<p><b>Exemple</b> : l’adversaire a 20 en Mêlée, vous avez 6. Vous jouez le Gel mordant : toutes les cartes de Mêlée valent 1. Il tombe à 4 cartes × 1 = 4, vous aussi à 2 cartes × 1 = 2. Il perd 16 points, vous en perdez 4. Les Héros et les cartes d’autres rangées ne bougent pas.</p>
<p><b>Protection</b> : les Héros (cadre doré) ignorent météo, cor et Brasier.</p>${sigTab(['close','ranged','siege'])}`) +
grp('Capacités des unités', `<p>Ces capacités se déclenchent quand la carte est posée ou tant qu’elle est sur le plateau.</p>${sigTab(['bond','morale','spy','medic','muster','agile','hero'])}`) +
grp('Skellige : Berserkers et Mardroeme', `<p>Les Berserkers sont des unités ordinaires. Le Mardroeme les transforme en ours de combat de force 8 dans la rangée choisie.</p>${sigTab(['berserk','mardroeme'])}`) +
grp('Cartes spéciales : cor, brasier, leurre', `<p>Le cor reste sur sa rangée jusqu’à la fin de la manche. Le brasier et la météo vont à la défausse après leur effet. Le leurre prend la place de l’unité qu’il reprend.</p>${sigTab(['horn','scorch','decoy'])}`) +
grp('Météo', `<p>Une carte météo ramène la force de sa rangée à 1 pour les deux camps. Le ciel dégagé annule toute la météo.</p>${sigTab(['frost','fog','rain','sun'])}`) +
grp('Factions', `<ul>
<li><b>Royaumes du Nord</b> : pioche une carte à chaque manche gagnée.</li>
<li><b>Nilfgaard</b> : remporte la manche en cas d’égalité.</li>
<li><b>Skellige</b> : joue les Berserkers et le Mardroeme ; 2 unités de la défausse reviennent au début de la manche 3.</li></ul>`) +
`<p class="hint">Touchez un titre pour l’ouvrir.</p>`;

/* Confirmation « Quitter la partie ? » : retour arrière, nouvelle partie, actualisation */
let inGame = false, quitAction = null;
function askQuit(action) {
  quitAction = action;
  showModal(`<h2>Quitter la partie ?</h2><p>La partie en cours sera perdue.</p>` +
    `<div class="ctl"><button class="btn" id="q-no">Continuer</button><button class="btn primary" id="q-yes">Quitter</button></div>`);
  $('q-no').onclick = () => { hideModal(); render(); if (G.turn === 'e' && !G.over) setTimeout(aiMove, 700); };
  $('q-yes').onclick = () => { inGame = false; const a = quitAction; quitAction = null; a(); };
}
window.addEventListener('beforeunload', e => { if (inGame && !G.over) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('popstate', () => {
  if (!inGame || G.over) return;
  history.pushState({ g: 1 }, '');
  if (!modalOpen) askQuit(restart);
});

/* Relance : jusqu'à deux cartes changées avant le premier round */
let mullSel = [];
function intro() {
  mullSel = [];
  const hand = G.hands.p.map(c => cardHtml(c, symOf(c), 'big', `data-mull="${c.id}"`)).join('');
  showModal(`${RULES}<p>${G.starter === 'p' ? 'Vous commencez.' : OPP_SUJ() + ' commence.'}</p>` +
    `<p>Relance : touchez jusqu’à deux cartes à changer, puis commencez.</p><div class="mull">${hand}</div>` +
    `<button class="btn primary" id="m-go">Commencer</button>`);
  $('m-go').onclick = () => {
    for (const id of mullSel) {
      const i = G.hands.p.findIndex(x => x.id === id);
      if (i < 0) continue;
      G.deck.p.push(G.hands.p.splice(i, 1)[0]);
      shuffle(G.deck.p);
      drawCards(G, 'p', 1);
    }
    mullSel = [];
    inGame = true; history.pushState({ g: 1 }, '');
    hideModal(); startMusic(); render(); if (G.turn === 'e') setTimeout(aiMove, 700);
  };
  render();
}

function factionPick() {
  showModal(`<h2>Choisissez votre faction</h2><div class="fac">${Object.keys(FAC).map(k => `<button class="btn" data-fac="${k}"><b>${FAC[k]}</b><br><small>${FAC_TXT[k]}</small></button>`).join('')}</div>`);
  render();
}
function restart() { hideModal(); factionPick(); }

$('app').addEventListener('click', e => {
  if (G.turn !== 'p' || G.over || modalOpen) return;
  const sc0 = sel && selCard();
  if (sc0 && !e.target.closest('[data-hand]')) {
    const rw = e.target.closest('.row[data-prow]');
    if (rw && rowOK(sc0, rw.dataset.prow)) { const id = sel; sel = null; return humanPlay(id, rw.dataset.prow); }
  }
  const insp = e.target.closest('[data-insp]');
  if (insp) { showInspect(+insp.dataset.insp); return; }
  const el = e.target.closest('[data-act],[data-hand]');
  if (!el) { if (sel) { sel = null; render(); } return; }
  if (el.dataset.hand) {
    const id = +el.dataset.hand;
    const c = G.hands.p.find(x => x.id === id);
    if (!c) return;
    if (sel === id) {
      if (needsTarget(c)) return;
      sel = null;
      return humanPlay(id);
    }
    sel = id;
    return render();
  }
  if (!sel) return;
  if (el.dataset.act === 'horn' && el.dataset.side === 'p' && !G.horn.p[el.dataset.row] && selCard().kind === 'horn') {
    const id = sel; sel = null; humanPlay(id, el.dataset.row);
  } else if ((el.dataset.act === 'decoy' || el.dataset.act === 'mard') && el.classList.contains('target')) {
    const id = sel; sel = null; humanPlay(id, +el.dataset.id);
  } else {
    sel = null; render();
  }
});

$('b-pass').onclick = () => {
  if (G.turn !== 'p' || G.over || modalOpen) return;
  G.passed.p = true; sel = null;
  pushLog('Vous passez.');
  afterAction();
};
$('modal').addEventListener('click', e => {
  const m = e.target.closest('[data-mull],[data-revive],[data-fac]');
  if (!m) return;
  if (m.dataset.fac) {
    G = newGame(m.dataset.fac, randFac()); sel = null; hideModal(); intro();
  } else if (m.dataset.mull) {
    const id = +m.dataset.mull;
    if (mullSel.includes(id)) mullSel = mullSel.filter(x => x !== id);
    else if (mullSel.length < 2) mullSel.push(id);
    m.classList.toggle('sel', mullSel.includes(id));
  } else {
    const t = G.grave.p.find(x => x.id === +m.dataset.revive);
    if (!t) return;
    G.grave.p.splice(G.grave.p.indexOf(t), 1);
    G.board.p[t.row].push(t);
    pushLog(`${t.name} revient au combat.`);
    hideModal(); sfxCard(); afterAction();
  }
});
$('b-new').onclick = () => { if (inGame && !G.over && !modalOpen) askQuit(restart); else restart(); };
/* Plein écran (si le navigateur le permet ; iPhone Safari ne le propose pas) */
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function paintFull() {
  const b = $('b-full');
  if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) { b.hidden = true; return; }
  b.textContent = fsEl() ? 'Quitter le plein écran' : 'Plein écran';
}
$('b-full').onclick = () => {
  if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement);
};
document.addEventListener('fullscreenchange', paintFull);
document.addEventListener('webkitfullscreenchange', paintFull);
paintFull();
$('b-opt').onclick = () => {
  if (modalOpen) return;
  showModal(`<h2>Options</h2><label class="opt"><input type="checkbox" id="o-names" ${namesOn ? 'checked' : ''}> Nom de l’adversaire</label><button class="btn primary" id="m-close">Fermer</button>`);
  $('o-names').onchange = e => {
    namesOn = e.target.checked;
    try { localStorage.setItem('gwent-names', namesOn ? '1' : '0'); } catch (err) {}
    render();
  };
  $('m-close').onclick = () => { hideModal(); render(); if (G.turn === 'e' && !G.over) setTimeout(aiMove, 700); };
};
$('b-rules').onclick = () => {
  if (modalOpen) return;
  showModal(`${RULES}<button class="btn primary" id="m-close">Fermer</button>`);
  $('m-close').onclick = () => { hideModal(); render(); if (G.turn === 'e' && !G.over) setTimeout(aiMove, 700); };
};


/* ===== Musique de fond ===== */
const TRACKS = ['music/track-a.mp3', 'music/track-c.mp3', 'music/track-d.mp3'];
const bgm = new Audio();
bgm.volume = 0.35;
let trackIdx = Math.floor(Math.random() * TRACKS.length);
let muted = false;
try { muted = localStorage.getItem('gwent-muted') === '1'; } catch (e) {}
function paintMute() {
  const b = $('b-mute');
  b.textContent = muted ? 'Son : off' : 'Son : on';
  b.setAttribute('aria-pressed', String(muted));
}
function startMusic() {
  if (muted) return;
  if (!bgm.getAttribute('src')) bgm.src = TRACKS[trackIdx];
  const r = bgm.play();
  if (r && r.catch) r.catch(() => {});
}
bgm.addEventListener('ended', () => {
  trackIdx = (trackIdx + 1) % TRACKS.length;
  bgm.src = TRACKS[trackIdx];
  startMusic();
});
$('b-mute').onclick = () => {
  muted = !muted;
  try { localStorage.setItem('gwent-muted', muted ? '1' : '0'); } catch (e) {}
  if (muted) bgm.pause(); else startMusic();
  paintMute();
};
paintMute();

if (!loadGame()) factionPick();
</script>

</body></html>
